<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>AI Browser - Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* === Навигационная панель === */
    .navbar {
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 50px;
    }

    .navbar-brand {
      font-size: 18px;
      font-weight: bold;
      color: #4a9eff;
      margin-right: 20px;
    }

    .navbar-button {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #e0e0e0;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .navbar-button:hover {
      background: #3a3a3a;
      border-color: #4a9eff;
    }

    .navbar-button.primary {
      background: #4a9eff;
      color: #fff;
      border-color: #4a9eff;
    }

    .navbar-button.primary:hover {
      background: #3a8eef;
    }

    /* === Контейнер контента === */
    .content-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* === Боковая панель === */
    .sidebar {
      width: 280px;
      background: #1a1a1a;
      border-right: 1px solid #333;
      padding: 15px;
      overflow-y: auto;
    }

    .sidebar-section {
      margin-bottom: 25px;
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 600;
      color: #888;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tab-item {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-item:hover {
      background: #3a3a3a;
      border-color: #4a9eff;
    }

    .tab-item.active {
      background: #4a9eff20;
      border-color: #4a9eff;
    }

    .tab-item-title {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-item-url {
      font-size: 11px;
      color: #888;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-item-model {
      font-size: 11px;
      color: #4a9eff;
      margin-top: 4px;
    }

    /* === Главная область === */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0f0f0f;
    }

    /* === Dashboard === */
    .dashboard {
      padding: 30px;
      overflow-y: auto;
    }

    .dashboard-header {
      margin-bottom: 30px;
    }

    .dashboard-title {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .dashboard-subtitle {
      font-size: 16px;
      color: #888;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .dashboard-card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 20px;
    }

    .dashboard-card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dashboard-card-icon {
      font-size: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .stat-item {
      text-align: center;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #4a9eff;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .log-container {
      background: #0a0a0a;
      border-radius: 8px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .log-entry {
      padding: 5px 0;
      border-bottom: 1px solid #222;
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-timestamp {
      color: #666;
      margin-right: 10px;
    }

    .log-level {
      font-weight: 600;
      margin-right: 10px;
    }

    .log-level.info {
      color: #4a9eff;
    }

    .log-level.warn {
      color: #ffb04a;
    }

    .log-level.error {
      color: #ff4a4a;
    }

    .models-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .model-item {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .model-info {
      flex: 1;
    }

    .model-name {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .model-provider {
      font-size: 12px;
      color: #888;
    }

    .model-badge {
      background: #4a9eff;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .model-badge.web {
      background: #ff8c4a;
    }

    .model-badge.local {
      background: #4aff8c;
      color: #000;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .empty-state-text {
      font-size: 16px;
      margin-bottom: 20px;
    }

    /* Скроллбар */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Навигационная панель -->
    <div class="navbar">
      <div class="navbar-brand">🤖 AI Browser</div>
      <button class="navbar-button primary" onclick="createNewTab()">+ Новая вкладка</button>
      <button class="navbar-button" onclick="refreshDashboard()">⟳ Обновить</button>
      <div style="flex: 1;"></div>
      <button class="navbar-button" onclick="openSettings()">⚙️ Настройки</button>
    </div>

    <!-- Контейнер контента -->
    <div class="content-container">
      <!-- Боковая панель с вкладками -->
      <div class="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-title">Активные вкладки</div>
          <div id="tabs-list">
            <div class="empty-state">
              <div class="empty-state-icon">📑</div>
              <div class="empty-state-text">Нет открытых вкладок</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Главная область - Dashboard -->
      <div class="main-area">
        <div class="dashboard">
          <div class="dashboard-header">
            <div class="dashboard-title">Панель управления</div>
            <div class="dashboard-subtitle">Мониторинг и управление AI-агентами</div>
          </div>

          <!-- Статистика -->
          <div class="dashboard-grid">
            <div class="dashboard-card">
              <div class="dashboard-card-title">
                <span class="dashboard-card-icon">📊</span>
                Статистика
              </div>
              <div class="stats-grid">
                <div class="stat-item">
                  <div class="stat-value" id="stat-tabs">0</div>
                  <div class="stat-label">Вкладок</div>
                </div>
                <div class="stat-item">
                  <div class="stat-value" id="stat-models">0</div>
                  <div class="stat-label">Моделей</div>
                </div>
                <div class="stat-item">
                  <div class="stat-value" id="stat-tasks">0</div>
                  <div class="stat-label">Задач</div>
                </div>
                <div class="stat-item">
                  <div class="stat-value" id="stat-uptime">0m</div>
                  <div class="stat-label">Время работы</div>
                </div>
              </div>
            </div>

            <!-- Доступные модели -->
            <div class="dashboard-card">
              <div class="dashboard-card-title">
                <span class="dashboard-card-icon">🧠</span>
                Доступные модели
              </div>
              <div class="models-list" id="models-list">
                <div class="empty-state">
                  <div>Загрузка...</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Логи -->
          <div class="dashboard-card">
            <div class="dashboard-card-title">
              <span class="dashboard-card-icon">📝</span>
              Журнал событий
            </div>
            <div class="log-container" id="log-container">
              <div class="log-entry">
                <span class="log-timestamp">[Загрузка...]</span>
                <span class="log-level info">[INFO]</span>
                <span>Инициализация AI Browser...</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../renderer/app.js"></script>
</body>
</html>
